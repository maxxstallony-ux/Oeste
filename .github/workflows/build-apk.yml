name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Android
        run: |
          mkdir -p ~/.config/godot ~/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ || true
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          JDK="${JAVA_HOME:-$(dirname $(dirname $(readlink -f $(which javac))))}"
          echo "SDK=$SDK JDK=$JDK"
          (yes | sdkmanager --sdk_root="$SDK" "build-tools;34.0.0" "platforms;android-34") || true
          ls "$SDK/build-tools" || true
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$HOME/debug.keystore" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JDK"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Importar recursos
        run: godot --headless --editor --quit || true

      - name: Exportar APK
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/oeste_saiyajin.apk

      - uses: actions/upload-artifact@v4
        with:
          name: oeste_saiyajin_apk
          path: build/oeste_saiyajin.apk
